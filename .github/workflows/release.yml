---
name: Build and Release

on:
  schedule:
    # Run every Sunday at 1 AM UTC
    - cron: "0 1 * * 0"
  workflow_dispatch:

env:
  PACKER_OUTPUT: packer/outputs/debian12-virtualbox-amd64/debian12-virtualbox.box
  REGISTRY: pluggero
  BOX_NAME: debian12-ansible
  SHORT_DESCRIPTION: Debian12 Vagrant box for Ansible Role Testing.
  PROVIDER: virtualbox
  ARCHITECTURE: amd64
  VBOX_VERSION: "7.2.18"
  VBOX_GUEST_VERSION: "7.2.14"

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/_lint.yml

  build:
    name: Build
    uses: ./.github/workflows/_build.yml
    needs: lint
    with:
      upload-artifact: true

  release:
    name: Release to HashiCorp Cloud
    runs-on: ubuntu-26.04
    needs: build
    permissions:
      id-token: write
      attestations: write
      contents: read
    outputs:
      version: ${{ steps.set_version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download box artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vagrant-box
          path: ./box

      - name: Set Release Version
        id: set_version
        run: |
          # Use YYYY.MM.DD format for version
          VERSION=$(date -u +"%Y.%m.%d")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set tag message
        id: tag_message
        run: |
          VERSION="${{ steps.set_version.outputs.version }}"
          TAG_MESSAGE="Weekly build ${VERSION}"
          echo "tag_message<<EOF" >> $GITHUB_OUTPUT
          echo "$TAG_MESSAGE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Get commit SHA and workflow URL
        id: build_metadata
        run: |
          echo "commit_sha=${GITHUB_SHA}" >> $GITHUB_OUTPUT
          echo "workflow_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> $GITHUB_OUTPUT

      - name: Authenticate to HCP
        id: hcp_auth
        run: |
          set -euo pipefail

          echo "Authenticating to HashiCorp Cloud Platform (HCP)..."

          response=$(curl --silent --show-error --location "https://auth.idp.hashicorp.com/oauth2/token" \
            --retry 2 --retry-delay 2 \
            --header "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=${{ secrets.HCP_CLIENT_ID }}" \
            --data-urlencode "client_secret=${{ secrets.HCP_CLIENT_SECRET }}" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "audience=https://api.cloud.hashicorp.com")

          token=$(echo "$response" | jq -r .access_token)

          if [[ -z "$token" || "$token" == "null" ]]; then
            echo "::error::Failed to retrieve access token from HCP authentication response."
            # Only surface the OAuth2 error fields, never the raw body.
            echo "$response" | jq '{error, error_description}' 2>/dev/null \
              || echo "(response was not valid JSON)"
            exit 1
          fi

          echo "::add-mask::$token"
          echo "token=$token" >> $GITHUB_OUTPUT

          echo "Authentication successful."

      - name: Prepare box upload
        id: prepare_box
        run: |
          set -euo pipefail
          source scripts/hcp_registry.sh

          ACCESS_TOKEN="${{ steps.hcp_auth.outputs.token }}"
          BOX_NAME="${{ env.BOX_NAME }}"
          VERSION="${{ steps.set_version.outputs.version }}"
          PROVIDER="${{ env.PROVIDER }}"
          ARCHITECTURE="${{ env.ARCHITECTURE }}"
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"

          echo "Starting box preparation..."

          echo "Checking if box '$BOX_NAME' exists..."

          box_code=$(hcp_api GET "https://api.cloud.hashicorp.com/vagrant/2022-09-30/registry/${REGISTRY}/box/${BOX_NAME}")

          if [[ "$box_code" == "404" ]]; then
            echo "Box does not exist. Creating box '$BOX_NAME'..."
            box_payload=$(jq -n \
              --arg name "$BOX_NAME" \
              --arg desc "$REPO_URL" \
              --arg short "$SHORT_DESCRIPTION" \
              '{name: $name, description: $desc, short_description: $short, is_private: false}')
            create_box_code=$(hcp_api POST "https://api.cloud.hashicorp.com/vagrant/2022-09-30/registry/${REGISTRY}/boxes" "$box_payload")
            require_success "$create_box_code" "Create box"
            jq . "$HCP_TMP_BODY"
            echo "Box created."
          else
            require_success "$box_code" "Check box existence"
            echo "Box already exists."
          fi

          echo
          echo "Checking if version '$VERSION' exists for box '$BOX_NAME'..."

          version_code=$(hcp_api GET "https://api.cloud.hashicorp.com/vagrant/2022-09-30/registry/${REGISTRY}/box/${BOX_NAME}/version/${VERSION}/provider/${PROVIDER}/architecture/${ARCHITECTURE}/download")

          if [[ "$version_code" == "404" ]]; then
            echo "Version does not exist. Creating version '$VERSION'..."

            # Construct description with build metadata
            DESCRIPTION="${{ steps.tag_message.outputs.tag_message }}

          Build Information
          - VirtualBox version: ${VBOX_VERSION}
          - VirtualBox Guest Additions version: ${VBOX_GUEST_VERSION}
          - Git commit: ${{ steps.build_metadata.outputs.commit_sha }}
          - Build workflow: ${{ steps.build_metadata.outputs.workflow_url }}

          To verify provenance: https://github.com/${{ github.repository }}#verifying-box-provenance"

            version_payload=$(jq -n \
              --arg name "$VERSION" \
              --arg desc "$DESCRIPTION" \
              --arg provider "$PROVIDER" \
              '{name: $name, description: $desc, provider_names: [$provider]}')
            create_version_code=$(hcp_api POST "https://api.cloud.hashicorp.com/vagrant/2022-09-30/registry/${REGISTRY}/box/${BOX_NAME}/versions" "$version_payload")
            require_success "$create_version_code" "Create version"
            jq . "$HCP_TMP_BODY"
            echo "Version created."

            echo
            echo "Creating provider '$PROVIDER'..."
            provider_payload=$(jq -n \
              --arg provider "$PROVIDER" \
              --arg arch "$ARCHITECTURE" \
              '{name: $provider, summary: {architectures_count: 1}, architecture_types: [$arch]}')
            create_provider_code=$(hcp_api POST "https://api.cloud.hashicorp.com/vagrant/2022-09-30/registry/${REGISTRY}/box/${BOX_NAME}/version/${VERSION}/providers" "$provider_payload")
            require_success "$create_provider_code" "Create provider"
            jq . "$HCP_TMP_BODY"
            echo "Provider created."

            echo
            echo "Calculating box checksum..."
            checksum=$(sha256sum ./box/debian12-virtualbox.box | awk '{print $1}')
            echo "Checksum: $checksum"

            echo
            echo "Creating checksums file with metadata..."
            {
              echo "$checksum  debian12-virtualbox.box"
              echo ""
              echo "Build Metadata"
              echo "- Version: $VERSION"
              echo "- Git commit: ${{ steps.build_metadata.outputs.commit_sha }}"
              echo "- Workflow run: ${{ steps.build_metadata.outputs.workflow_url }}"
              echo "- Build date: $(date --utc +"%Y-%m-%d %H:%M:%S UTC")"
              echo "- VirtualBox version: $VBOX_VERSION"
              echo "- VirtualBox Guest Additions version: $VBOX_GUEST_VERSION"
              echo ""
              echo "Repository: ${{ github.server_url }}/${{ github.repository }}"
            } > ./box/checksums.txt
            echo "Checksums file created."

            echo
            echo "Creating architecture '$ARCHITECTURE'..."
            architecture_payload=$(jq -n \
              --arg arch "$ARCHITECTURE" \
              --arg checksum "$checksum" \
              --arg size "$(stat --format="%s" ./box/debian12-virtualbox.box)" \
              --arg created_at "$(date --utc +"%Y-%m-%dT%H:%M:%SZ")" \
              '{architecture_type: $arch, default: true, box_data: {checksum: $checksum, checksum_type: "SHA256", size: $size, created_at: $created_at, updated_at: $created_at}}')
            create_arch_code=$(hcp_api POST "https://api.cloud.hashicorp.com/vagrant/2022-09-30/registry/${REGISTRY}/box/${BOX_NAME}/version/${VERSION}/provider/${PROVIDER}/architectures" "$architecture_payload")
            require_success "$create_arch_code" "Create architecture"
            jq . "$HCP_TMP_BODY"
            echo "Architecture created."

            echo "skip_upload=false" >> $GITHUB_OUTPUT
          else
            require_success "$version_code" "Check version existence"
            echo "Version already exists."
            echo "skip_upload=true" >> $GITHUB_OUTPUT
          fi

      - name: Attest checksums file
        if: steps.prepare_box.outputs.skip_upload == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ./box/checksums.txt

      - name: Upload checksums as artifact
        if: steps.prepare_box.outputs.skip_upload == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: checksums-${{ steps.set_version.outputs.version }}
          path: ./box/checksums.txt

      - name: Upload box
        if: steps.prepare_box.outputs.skip_upload == 'false'
        run: |
          set -euo pipefail
          source scripts/hcp_registry.sh

          ACCESS_TOKEN="${{ steps.hcp_auth.outputs.token }}"
          BOX_NAME="${{ env.BOX_NAME }}"
          VERSION="${{ steps.set_version.outputs.version }}"
          PROVIDER="${{ env.PROVIDER }}"
          ARCHITECTURE="${{ env.ARCHITECTURE }}"

          echo "Starting upload of box '$BOX_NAME' version '$VERSION'..."

          echo
          echo "Fetching upload URL..."
          fetch_url_code=$(hcp_api GET "https://api.cloud.hashicorp.com/vagrant/2022-09-30/registry/${REGISTRY}/box/${BOX_NAME}/version/${VERSION}/provider/${PROVIDER}/architecture/${ARCHITECTURE}/upload")
          require_success "$fetch_url_code" "Fetch upload URL"

          upload_url=$(jq -r .url "$HCP_TMP_BODY")

          if [[ -z "$upload_url" || "$upload_url" == "null" ]]; then
            echo "::error::Failed to retrieve upload URL."
            # .url is a presigned credential; only log keys, not values.
            jq 'keys' "$HCP_TMP_BODY" 2>/dev/null || echo "(response was not valid JSON)"
            exit 1
          fi

          echo "Upload URL retrieved."

          echo
          echo "Uploading box file..."
          curl --show-error --fail-with-body --retry 2 --retry-delay 2 \
            --request PUT --upload-file ./box/debian12-virtualbox.box "$upload_url"
          echo "Box upload completed."

          echo
          echo "Finalizing release..."
          finalize_code=$(hcp_api PUT "https://api.cloud.hashicorp.com/vagrant/2022-09-30/registry/${REGISTRY}/box/${BOX_NAME}/version/${VERSION}/release")
          require_success "$finalize_code" "Finalize release"

          echo
          echo "Box version released successfully!"

  tag:
    name: Create and Push Tag
    uses: ./.github/workflows/_tag.yml
    needs: release
    permissions:
      contents: write
    with:
      version: ${{ needs.release.outputs.version }}
